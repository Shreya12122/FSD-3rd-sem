<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Student Management System</h1>

    <div class="summary">
        Total Students:
        <span id="totalStudents">0</span>
    </div>

    <div class="form">

        <input type="number" id="id" placeholder="Student ID">

        <input type="text" id="name" placeholder="Student Name">

        <select id="branch">
            <option value="">Select Branch</option>
            <option>CSE</option>
            <option>IT</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>ME</option>
        </select>

        <input type="text" id="year" placeholder="Year">

        <input type="number" id="cgpa" placeholder="CGPA">

        <button onclick="addStudent()">Add Student</button>

    </div>

    <div class="controls">

        <input
            type="text"
            id="search"
            placeholder="Search by Name"
            onkeyup="displayStudents()"
        >

        <select
            id="filter"
            onchange="displayStudents()"
        >
            <option>All</option>
            <option>CSE</option>
            <option>IT</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>ME</option>
        </select>

    </div>

    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Branch</th>
            <th>Year</th>
            <th>CGPA</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody id="studentTable">

        </tbody>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
